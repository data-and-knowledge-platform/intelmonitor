# Investment team links (collected 2026-10-26): group structure, MAS licences, listings and
# disclosed stakes for BlackRock, Vanguard, Schroders, PIMCO, GIC, Fullerton Fund Management,
# Lion Global Investors, Temasek, EDBI and Vertex Ventures, with the stakes these investors hold
# in other entities on the shared list.
# Sources: MAS Financial Institutions Directory, SEC filings (BlackRock 10-K exhibit 21, proxy
# statements of JPMorgan, Citigroup, Microsoft and Coinbase, HSBC and UBS 20-F, Circle 10-K),
# HKEX TR-1 notices, company sites (Seviora, Fullerton, OCBC, Vertex, EDB, Stripe, Circle,
# Allianz), SGX announcements and reputable trade press. Quotes are verbatim, whitespace
# normalised; table rows join cells with " | ".
# Notes
#   - vertex-ventures is Vertex Ventures Southeast Asia & India (Singapore); its anchor investor
#     Vertex Holdings is the separate node vertex-holdings, wholly owned by Temasek.
#   - Schroders was taken private by Nuveen on 1 October 2026, so it has no listing row.
#   - Temasek -> DBS, Partior and Climate Impact X are already in entity-links.yaml.
#   - EDBI rows cover the financial-sector companies on edbi.com/portfolio (read in a headed
#     browser on 2026-10-26; the site blocks scripted fetches); quotes are the card text.
