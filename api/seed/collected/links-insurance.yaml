# Insurance team links (collected 2026-10-26): parent groups, MAS insurer licences, listings,
# bancassurance ties with banks on the shared list, industry associations and major markets for
# great-eastern, prudential-singapore, aia-singapore, income-insurance, singlife, manulife-singapore
# and allianz. Sources: MAS Financial Institutions Directory (insurer licence lists), LIA and GIA
# member lists, company sites and press releases, HKEX and SGX filings (AIA 2026 interim results,
# HSBC and OCBC announcements), SEC filings (Manulife 2025 Form 40-F, Prudential plc HY2026 6-K,
# PIMCO fund prospectus) and the MCCY ministerial statement on the Allianz-Income offer.
# Links already in entity-links.yaml (ocbc holds_stake_in great-eastern, great-eastern operates_in
# malaysia, great-eastern and income-insurance regulated_by mas, great-eastern regulated_by bnm) and
# tech-dependencies.yaml (great-eastern on oracle-cloud, singlife on aws) are not repeated.
# Bancassurance ties are distributes_products_for rows with service distribution, from the bank to
# the insurer whose products it sells (depends_on rows until 17 Nov 2026). Table quotes join the heading or row cells with " | " (cell text verbatim).
# Licence and membership rows date from the day the register was read.
