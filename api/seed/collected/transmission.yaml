- id: eef4884ef9bd
  number: 2
  date: 2026-11-17
  note: The transmission half of the team's prompt (deck of 16 Nov 2026, page 6) with four values, page
    13's examples as typical ratings, and THINK_FIRST; effort high, as the priority pick.
  model: claude-sonnet-5-5
  effort: high
  text: |-
    DIRECTIONAL TRANSMISSION
    For every identified relationship, classify impact transmission independently in both directions.
    Question: "If the source entity experiences a material adverse event relevant to this relationship, how materially could the target entity be affected through this relationship?"
    Allowed values: Strong | Moderate | Weak | Non-propagating
    Strong: A relevant material event at the source could cause a material or significant impact on the target. Indicators include critical dependency, control, high exposure or concentration, or low substitutability.
    Moderate: A relevant material event at the source could cause a meaningful but contained impact on the target. The relationship is material, but alternatives, diversification or limited scope reduce the impact.
    Weak: A relevant material event at the source would normally cause only limited impact on the target. The relationship is small, diversified, replaceable or non-critical.
    Non-propagating: The relationship exists, but an event at the source should not normally be inferred to affect the target in this direction.
    TRANSMISSION RULES
    1. Assess each relationship separately.
    2. Assess both directions independently.
    3. Rate impact transmission, not general closeness, prominence or strategic importance.
    4. Base the rating on the relationship reason and factual evidence, including ownership percentage, exposure, concentration, criticality and substitutability.
    5. Do not automatically rate any relationship type Strong.
    6. Do not invent missing materiality, concentration or dependency.
    7. Where evidence is limited, use the more conservative supported rating.
    TYPICAL RATINGS
    These are typical ratings for some relationship types and directions. They are not fixed: the evidence for each relationship decides its rating in each direction.
    - member_of, bank event → association: Weak or Moderate, depending on significance
    - member_of, association event → bank: Often Non-propagating, unless the event directly affects members
    - listed_on, company event → exchange: Usually Non-propagating or Weak
    - listed_on, exchange outage → company: Moderate or Strong
    - regulated_by, firm event → regulator: Usually Weak
    - regulated_by, new regulation → firm: Moderate or Strong
    - provides_* (critical provider), bank event → provider: Weak, unless the bank is a concentrated customer of the provider
    - provides_* (critical provider), provider outage → bank: Moderate or Strong
    - belongs_to_sector, sector-wide event → member: Weak or Moderate
    - belongs_to_sector, member event → sector: Usually Non-propagating, unless the member is systemically significant
    Think the problem through before you answer.
