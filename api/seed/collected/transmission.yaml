    \ independently. A→B and B→A may have different ratings.\n2. Rate IMPACT TRANSMISSION, not general\
    \ relationship importance, closeness, similarity or prominence.\n3. Assume a MATERIAL adverse event\
    \ occurs at the source entity. Do not vary the rating based on the severity of a specific news finding.\n\
    4. Use the provided relationship type and relationship reason as the primary evidence. Give particular\
    \ weight to quantitative evidence such as ownership %, exposure %, concentration and dependency levels.\n\
    5. Do not automatically rate any relationship type as Strong. For example, a depends_on relationship\
    \ may be Strong, Moderate or Weak depending on criticality and substitutability.\n6. Consider direction\
    \ carefully. A supplier may be critical to a customer while that customer represents only a small\
    \ part of the supplier's business.\n7. Do not assume symmetry. The same relationship can be Strong\
