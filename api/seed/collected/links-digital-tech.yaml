# Digital asset and technology team links (collected 2026-10-26): Circle, Coinbase, Crypto.com, Ripple,
# Sygnum, Microsoft and Ant International, plus the corporate parents and listings of AWS and Google Cloud
# (their Singapore regions and FI customers are in tech-dependencies.yaml and are not repeated).
# General links only: group structure and Singapore licensed entities, MAS licences from the MAS Financial
# Institutions Directory, home and foreign regulators, listings, stakes held by or in other tracked entities,
# MAS BLOOM membership, and a few dependencies that tie these firms to each other or to tracked banks.
# Reserve composition, revenue lines and dealer exposures are deliberately left out.
# Sources: SEC filings (10-K, proxy statements, Exhibit 21), the MAS Financial Institutions Directory, the
# FINMA list of authorised banks, MAS and company press releases, and press where no primary source was
# reachable (marked reported). Quotes are verbatim with whitespace normalised; table cells joined with " | ".
# Schema: see entity-links.yaml (relationships) and tech-dependencies.yaml (depends_on_participates).
# Licences are supervised_by edges from the licensed entity; the subject owns that entity (share null when
# no stake is published), so impact paths reach MAS in two hops (circle owns circle-singapore, ...).
collected: 2026-10-26

