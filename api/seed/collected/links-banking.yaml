# Banking team links (collected 2026-10-26): group structure, MAS licences, home regulators,
# listings and Singapore market roles for Standard Chartered, HSBC, Citigroup, J.P. Morgan,
# Bank of China, Maybank, UBS, GXS Bank and Trust Bank.
# Each foreign group owns its Singapore node (standard-chartered-singapore, hsbc-singapore,
# citibank, jpmorgan-singapore, ubs-singapore) and the licence sits on that node. bank-of-china
# and maybank are single nodes: Bank of China's Singapore operation is a branch of the same legal
# entity, and existing rows already map Maybank Singapore Limited to `maybank`.
# MAS licences come from the MAS Financial Institutions Directory (FID), read on 2026-10-26; FID
# quotes join the institution name, incorporation and licence cells with " | ".
# Other sources: company filings and annual reports (SEC 10-K, HKEX announcements, Maybank AR
# 2025), company websites, the PRA and FINMA.
# Not repeated here: FAST, PayNow, MEPS+, GIRO, eGIRO, NETS, SWIFT, card scheme and cloud rows
# (tech-dependencies.yaml); D-SIB designations, COSMIC, Project Guardian, Partior and Climate
# Impact X (entity-links.yaml); citibank and maybank MAS licence rows (an existing
# supervised_by mas row from another source would make them repeats); Grab and Singtel
# ownership of GXS Bank (tech-dependencies.yaml).
collected: 2026-10-26

