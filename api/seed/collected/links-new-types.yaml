  model: claude-sonnet-5-5
  effort: high
  text: |-
    You are identifying evidenced relationships between Entity A and Entity B.
    A pair of entities may have multiple relationship types. Return each distinct relationship separately.
    Here Entity A is the entity named in the message, and Entity B is any other entity on the ENTITIES list below. The evidence is what you find with web search and read with web fetch.

    ALLOWED RELATIONSHIP TYPES
    Each relationship reads from its first entity to its second as its type's name says (A holds_stake_in B, A lends_to B, A material_customer_of B, A regulated_by B). provides_customer_benefits_with and jointly_offers_product_with have no direction.
    Ownership and financial:
    - holds_stake_in: Equity ownership. Example: Temasek holds a material stake in DBS.
    - lends_to: Material lending or credit exposure. Example: Bank A provides significant loans to Property Developer B.
    - invests_in: Material investment other than lending. Example: Fund A holds bonds issued by Company B.
    - funds: Material funding or liquidity provision. Example: Parent A provides significant funding to Subsidiary B.
    - insures: Material insurance coverage. Example: Insurer A provides business-interruption insurance to Company B.
    Operational and commercial:
    - provides_technology_to: Cloud, software or technology infrastructure. Example: AWS provides production cloud services to Bank A.
    - provides_connectivity_to: Telecom or network connectivity. Example: Singtel provides enterprise connectivity to DBS.
    - provides_business_service_to: Material outsourced or professional service not covered elsewhere. Example: An engineering provider performs material aircraft-engine maintenance for an airline.
    - processes_transactions_for: Payment, clearing or transaction processing. Example: Processor A processes card transactions for Bank B.
    - shares_or_processes_data_with: Receives, shares or processes relevant data. Example: MoneySmart collects and transmits bank-product application data.
    - distributes_products_for: Distributes, compares or refers customers to another entity's products. Example: MoneySmart refers customers to Bank A's cards.
    - provides_customer_benefits_with: Joint customer benefits, loyalty or redemption arrangements. Example: Bank cardholders earn or redeem KrisFlyer miles with SIA.
    - jointly_offers_product_with: Entities jointly operate, brand or provide a product. Example: A bank and fintech jointly offer a digital-payment product.
    - material_customer_of: Customer is materially important to the provider. Example: Company A represents a significant share of Vendor B's revenue.
    - material_supplier_to: Material supply of goods, equipment or non-technology inputs. Example: An engine manufacturer supplies the engine model used across a material share of an airline's fleet.
    Structural and institutional:
    - regulated_by: Licensed, supervised or regulated by. Example: Bank A is regulated by MAS.
    - operates_in: Material operations in a jurisdiction. Example: Bank A has significant operations in India.
    - exposed_to: Material economic, country or market exposure. Example: Bank A has significant credit exposure to China.
    - member_of: Formal membership of an organisation or network. Example: Bank A is a member of ABS.
    - participates_in: Participation in a scheme, programme or initiative. Example: Bank A participates in Project Guardian.
    - listed_on: Securities listed on an exchange. Example: Company A is listed on SGX.
    - belongs_to_sector: Membership of a monitored aggregate sector. Example: DBS belongs to the Singapore Banking Sector.
    belongs_to_sector is taken from the entity list's groups: do not look for it.
    A firm's participation in, membership of or settlement through an entity whose kind is payment system or market infrastructure is stored as that system processes_transactions_for the firm (FAST processes_transactions_for Bank A), not as participates_in or member_of. participates_in is for schemes, programmes and initiatives, and member_of for associations and networks that are not payment systems or market infrastructures. A company whose securities trade on an exchange is listed_on it.
    A bank's loan book by sector or country is exposed_to toward the sector or country entity, as the stored links have it; lends_to is for a loan or facility to a named borrower that is itself on the ENTITIES list.
    participates_in is used only when the scheme, programme or initiative is itself on the ENTITIES list; a programme's owner, operator or sponsor does not stand in for it.
    Two owners of one company each hold a stake in it (each holds_stake_in the company); owning, setting up or backing the same company is not jointly_offers_product_with between the owners.

    MATERIALITY
    A relationship must be material as its type's meaning says: "Material lending or credit exposure", "Material investment other than lending", "Material funding or liquidity provision", "Material insurance coverage", "Material outsourced or professional service", "Customer is materially important to the provider", "Material supply of goods, equipment or non-technology inputs", "Material operations in a jurisdiction", "Material economic, country or market exposure". A bank's ordinary interbank line to another bank is not a lends_to relationship.

    RELATIONSHIP IDENTIFICATION RULES
    1. Return every distinct relationship between the entities that is supported by the provided evidence.
    2. A pair of entities may have several relationships. Do not combine them into one generic relationship.
    3. Use only the 22 allowed relationship types.
    4. Store the relationship in its canonical direction. Do not create inverse types such as owned_by, borrower_of or serviced_by.
    5. The relationship reason must be one concise factual sentence capturing the relevant service, product, geography, ownership, exposure, amount, percentage, concentration or other material detail.
    6. Do not infer a relationship merely because the entities operate in the same industry, geography or ecosystem, or appear together in news.
    7. Select the most specific allowed relationship type. Use relationship_reason to capture the precise product, service, equipment, customer arrangement, geography or financial exposure. Do not create a new type where an existing allowed type already describes the pathway.
    8. If no allowed relationship is sufficiently evidenced, return an empty relationships array.

    EVIDENCE
    Open every page you rely on with web fetch. Each relationship names that page's URL and title, the date it was published (or the date of the fact it reports), and a quote: one passage copied word for word from the fetched page that shows the relationship, with no ellipsis, no joined pieces and no paraphrase. The quote must name Entity A or Entity B, and the page must name both; a heading, a code or a name alone is not a quote that shows a relationship. Each quote is checked against the page.

    WHEN YOU ARE FINISHED
    You are finished when you have searched for every one of the 21 types other than belongs_to_sector, for relationships between Entity A and the entities on the list. Your answer has one entry for each of those 21 types: the relationships of that type you found, or, when you found none, the search queries you tried for it.

    ENTITIES
    {entities}

    Think the problem through before you answer.
