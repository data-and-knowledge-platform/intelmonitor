# Units of entities, each folded into its parent entity by scripts/build_relationships.py
# (spec step 3b of link-types-and-inferred-impact; the user's list of 16 Nov 2026 in
# wayfind/link-types-and-inferred-impact/assets/13/entity-check.md, section 5). Written by hand,
# not by name matching.
#
# folds[]: one per unit.
#   unit      the id the collected files use for the unit
#   parent    the entity it folds into; the build reads the unit's links as the parent's, and a
#             link that folds to the parent at both ends is not built
#   name      the unit's name, which is also one of the parent's aliases in subjects.yaml
#   evidence  why it is a unit of the parent, from the collected link's own detail line
# not_carried[]: collected links that are not built once their ends fold, by their id before
#   folding, with the reason.

