# Payments team links (collected 2026-10-26): group structure, MAS licences, listings, investors,
# payment system and card scheme participation, and cloud dependencies for CDP, CLS, NETS, BCS,
# Grab, SeaMoney (Monee), Wise, Airwallex, Nium, Stripe and 2C2P.
# Each fintech group owns its Singapore licensed entity and the MAS licence sits on that entity
# (grab owns grabpay, wise owns wise-asia-pacific, airwallex owns airwallex-singapore, stripe owns
# stripe-singapore). nium and 2c2p are single nodes: NIUM Pte. Ltd. and 2C2P Pte. Ltd. are the
# Singapore-incorporated headquarters entities. SeaMoney was renamed Monee in May 2025; sea-limited
# is the NYSE-listed parent.
# MAS licences come from the MAS Financial Institutions Directory (FID), read on 2026-10-26; FID
# quotes join the institution name, incorporation and licence cells with " | ".
# CLS shareholder and settlement member rows come from the CLS lists read on 2026-10-26; quotes join
# the list heading with the member's name and location cells.
# Other sources: SEC 20-F filings (Grab FY2025, Sea FY2025, Wise FY2026), MAS payment systems page,
# company websites and press releases, and trade press for funding rounds (marked reported where the
# stake may since have changed).
# Not repeated here: FAST, PayNow, MEPS+, GIRO and eGIRO participation, NETS debit scheme banks,
# bank ownership of NETS, NETS ownership of BCS, BCS as operator of FAST, PayNow, GIRO and eGIRO,
# SGX ownership of CDP, Grab and Singtel ownership of GXS Bank, MariBank card and SWIFT rows
# (tech-dependencies.yaml and entity-links.yaml); GXS Bank's MAS licence (links-banking.yaml);
# Temasek, GIC and Vertex stakes in Grab, Nium and Stripe (links-investment.yaml); Ant
# International ownership of 2C2P (links-digital-tech.yaml).
collected: 2026-10-26

