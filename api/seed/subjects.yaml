  # in one of the first 8 to that group alone, any other entity to each of its groups.
  # MAS top 50 entities, by the list's parent category; banking and fintech also hold the banks
  # and fintechs added on 16 Nov 2026.
  - id: banking
    name: Banking
    topics: [banking-lending, financial-regulation, cyber-resilience, aml-sanctions]
