    members: [meps-plus, fast, paynow, giro, nets, bcs, swift, visa, mastercard, paypal, alipay]
  - id: tech-providers
    name: Technology providers
    topics: [cyber-resilience, tech-infrastructure]
    members: [aws, microsoft-azure, microsoft-365, google-cloud, oracle-cloud, equinix, crowdstrike, singtel, thought-machine, toppan-next-tech, tencent, meta, anthropic, openai, nvidia, amd, apple]
  # Exchange hacks and outages, custody and reserve bank concentration, AML/CFT enforcement.
